name: Copacel
options:
  bundleIdPrefix: io.razza
  # Without this, XcodeGen expands the Icon Composer .icon package into individual file
  # references instead of a single bundle reference, and Xcode no longer recognizes it
  # as an app icon. https://github.com/yonaskolb/XcodeGen/issues/1556
  fileTypes:
    icon:
      file: true
configs:
  Debug: debug
  Release: release
packages:
  CopacelCore:
    path: CopacelCore
targets:
  Copacel:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Copacel
    dependencies:
      - package: CopacelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.razza.Copacel
        PRODUCT_NAME: Copacel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Copăcel"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

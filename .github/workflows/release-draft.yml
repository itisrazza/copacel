name: Draft release

# Drafts a GitHub Release from a pushed version tag (e.g. v1.0.0). No binary is
# attached here — sign the build locally with Scripts/package-release.sh, then
# upload the resulting DMG to the draft and publish it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "Copacel ${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "Copacel ${{ github.ref_name }}" \
              --generate-notes
          fi
